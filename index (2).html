<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Compound Expenses</title>
<style>
:root{--n:#0f2742;--sun:#ffc21a;--l:#d3dde6;--mu:#52647a;--w:#2f80c9;--e:#ffc21a;--o:#7b8da3;--bad:#b3261e}*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#13233a;background:#f3f6f9}
header{background:var(--n);color:#fff}.w{max-width:1000px;margin:0 auto;padding:0 16px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0}.top b{font-size:1.2rem;margin-right:auto}
.top select,.top button{min-height:42px;border-radius:8px;border:0;padding:0 12px;font:inherit}.top button{background:#ffffff22;color:#fff;border:1.5px solid #fff5;cursor:pointer}.top button[aria-pressed=true]{background:var(--sun);color:var(--n);font-weight:700}
main{padding:20px 0 60px}.card{background:#fff;border:1px solid var(--l);border-radius:12px;padding:16px;margin-bottom:16px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}.g .card{margin:0}
.big{font-size:1.6rem;font-weight:800}.mu{color:var(--mu)}h2,h3{margin:.1em 0 .5em}
label{display:grid;gap:3px;font-size:.88rem;font-weight:600}input,select{min-height:42px;border:1.5px solid var(--l);border-radius:8px;padding:0 10px;font:inherit;background:#fff}
form.f,.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.row{align-items:center}
.b{min-height:42px;padding:0 16px;border-radius:8px;border:0;background:var(--n);color:#fff;font:600 1rem inherit;cursor:pointer}.b.s{min-height:32px;padding:0 10px;font-size:.85rem}.b.o{background:#fff;color:var(--n);border:1.5px solid var(--n)}
.chip{min-height:38px;padding:0 14px;border-radius:99px;border:1.5px solid var(--n);background:#fff;font:inherit;cursor:pointer}.chip[aria-pressed=true]{background:var(--n);color:#fff}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.93rem}th,td{padding:8px;border-bottom:1px solid var(--l);text-align:left;vertical-align:top}th{background:#eef3f7}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#t{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9}#t.e{background:var(--bad)}
.note{background:#fff7dd;border:1px solid #f0d27a;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:.92rem}
#ph{display:none}@media print{header,.noprint,.note{display:none!important}#ph{display:block}body{background:#fff}.card{border:0;padding:0}}
</style></head><body>
<header><div class="w"><div class="top"><b>My Compound Expenses</b>
<button id="mt" aria-pressed="true">Tenant view</button><button id="mm" aria-pressed="false">Manager view</button><select id="who" aria-label="Choose tenant (demo sign-in)"></select></div></div></header>
<main class="w"><div class="note noprint"><strong>Demo.</strong> Data is saved only in this browser, and choosing a tenant is not a real login. Amounts are shared bills allocated to each tenant, in GH₵. No payments are processed here.</div><div id="v"></div></main>
<div id="t" role="status" aria-live="polite"></div>
<script>
const KEY="te-1",$=s=>document.querySelector(s);
let D;try{D=JSON.parse(localStorage.getItem(KEY))||{rooms:[],ten:[],bills:[]}}catch(e){D={rooms:[],ten:[],bills:[]}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9),pad=n=>String(n).padStart(2,"0"),iso=(y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d);
const now=new Date(),TODAY=iso(now.getFullYear(),now.getMonth(),now.getDate());
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const M=p=>"GH₵"+(p/100).toLocaleString("en-GH",{minimumFractionDigits:2,maximumFractionDigits:2});
function toP(v){const s=String(v).trim().replace(/,/g,"");if(!/^\d+(\.\d{1,2})?$/.test(s))throw new Error("Enter a valid amount, e.g. 150 or 150.50");const[a,b=""]=s.split(".");return +a*100+ +b.padEnd(2,"0")}
function alloc(total,w){const T=BigInt(total),S=BigInt(w.reduce((a,b)=>a+b,0));if(S<=0n)throw new Error("Nothing to split");const p=w.map((x,i)=>({i,b:T*BigInt(x)/S,r:T*BigInt(x)%S}));let left=Number(T-p.reduce((a,x)=>a+x.b,0n));[...p].sort((x,y)=>y.r>x.r?1:y.r<x.r?-1:x.i-y.i).forEach(x=>{if(left-->0)x.b+=1n});return p.map(x=>Number(x.b))}
let tt;function toast(m,e){const t=$("#t");t.textContent=m;t.className=e?"e":"";t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",3200)}
const room=id=>D.rooms.find(r=>r.id===id),act=()=>D.ten.filter(t=>t.on),ten=id=>D.ten.find(t=>t.id===id);
const grp=c=>c==="Water"||c==="Electricity"?c:"Other",COL={Water:"var(--w)",Electricity:"var(--e)",Other:"var(--o)"},MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const METH={equal:"Equal split",room:"By room rent",fixed:"Fixed per tenant"};
function addBill(cat,desc,total,date,m){const a=act();let sh;if(m==="equal")sh=alloc(total,a.map(()=>1));else if(m==="room")sh=alloc(total,a.map(t=>room(t.room).rent));else{sh=a.map(()=>total);total*=a.length}const s={};a.forEach((t,i)=>s[t.id]=sh[i]);D.bills.push({id:uid(),cat,desc,total,date,m,sh:s,st:"ok"})}
function seed(){D={rooms:[],ten:[],bills:[]};[["Room 1",35000,"Ama Mensah"],["Room 2",40000,"Kofi Boateng"],["Room 3",45000,"Efua Owusu"]].forEach(([l,r,n])=>{const id=uid();D.rooms.push({id,label:l,rent:r});D.ten.push({id:uid(),room:id,name:n,on:1})});
let s=7;const rnd=()=>(s=(s*9301+49297)%233280)/233280,Y=now.getFullYear();
for(let y=Y-1;y<=Y;y++)for(let mo=0;mo<12;mo++){[["Water",28000,14000],["Electricity",90000,50000]].forEach(([c,b,v])=>{const d=iso(y,mo,10+Math.floor(rnd()*12));if(d<=TODAY)addBill(c,c+" bill",Math.round((b+rnd()*v)/100)*100,d,c==="Water"?"equal":"room")});
if(rnd()<.5){const d=iso(y,mo,25);if(d<=TODAY)addBill("Cleaning","Compound cleaning",Math.round((8000+rnd()*4000)/100)*100,d,"equal")}}
save()}
let mode="tenant",me="",range="last12",cat="All",q="",pg=0;
function win(r){if(r==="last12"){const a=new Date(now.getFullYear(),now.getMonth()-11,1),p=new Date(now.getFullYear(),now.getMonth()-23,1),pe=new Date(now.getFullYear(),now.getMonth()-11,0);return{f:iso(a.getFullYear(),a.getMonth(),1),t:TODAY,pf:iso(p.getFullYear(),p.getMonth(),1),pt:iso(pe.getFullYear(),pe.getMonth(),pe.getDate()),label:"the last 12 months",months:12}}
const y=+r;return{f:y+"-01-01",t:y+"-12-31",pf:(y-1)+"-01-01",pt:(y-1)+"-12-31",label:r,months:y===now.getFullYear()?now.getMonth()+1:12}}
const mine=()=>D.bills.filter(b=>b.st!=="void"&&b.sh[me]!=null);
const inW=(b,f,t)=>b.date>=f&&b.date<=t,sum=a=>a.reduce((x,y)=>x+y,0);
function monthsOf(r){const o=[];for(let i=0;i<12;i++){const d=r==="last12"?new Date(now.getFullYear(),now.getMonth()-11+i,1):new Date(+r,i,0+1);o.push({k:d.getFullYear()+"-"+pad(d.getMonth()+1),l:MN[d.getMonth()]+(r==="last12"?" "+String(d.getFullYear()).slice(2):"")})}return o}
function chart(ms,data){const W=720,H=250,L=56,B=34,T=10,cw=(W-L-8)/12,mx=Math.max(1,...ms.map(m=>sum(Object.values(data[m.k]||{}))));const top=Math.ceil(mx/100/100)*100*100;let g="";
for(let i=0;i<=4;i++){const v=top*i/4,y=H-B-(H-B-T)*i/4;g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#d3dde6"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#52647a">${Math.round(v/100)}</text>`}
ms.forEach((m,i)=>{let y=H-B;const x=L+i*cw+cw*.15;["Water","Electricity","Other"].forEach(c=>{const v=(data[m.k]||{})[c]||0,h=v/top*(H-B-T);if(h>0){y-=h;g+=`<rect x="${x}" y="${y}" width="${cw*.7}" height="${h}" fill="${COL[c]}"><title>${m.l} ${c}: ${M(v)}</title></rect>`}});g+=`<text x="${x+cw*.35}" y="${H-12}" text-anchor="middle" font-size="10" fill="#52647a">${m.l}</text>`});
return `<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="Monthly expenses stacked by water, electricity and other. Full figures are in the table below.">${g}</svg>`}
const A={};
A.seed=()=>{seed();me=act()[0].id;render();toast("Sample data loaded")};
A.reset=()=>{if(confirm("Delete all demo data in this browser?")){D={rooms:[],ten:[],bills:[]};save();me="";render()}};
A.csv=()=>{const w=win(range),rows=[["Date","Category","Description","Bill total GHS","Split","My share GHS"],...mine().filter(b=>inW(b,w.f,w.t)).sort((a,b)=>a.date.localeCompare(b.date)).map(b=>[b.date,b.cat,b.desc,(b.total/100).toFixed(2),METH[b.m],(b.sh[me]/100).toFixed(2)])],c=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="my-expenses-"+range+".csv";a.click()};
A.person=e=>{e.preventDefault();try{const f=new FormData(e.target),n=f.get("n").trim(),l=f.get("l").trim();if(n.length<2||!l)throw new Error("Enter the tenant's name and room");if(D.rooms.some(r=>r.label.toLowerCase()===l.toLowerCase()))throw new Error("That room already exists");const id=uid();D.rooms.push({id,label:l,rent:toP(f.get("r"))});D.ten.push({id:uid(),room:id,name:n,on:1});save();if(!me)me=act()[0].id;render();toast("Tenant added")}catch(x){toast(x.message,1)}return false};
A.bill=e=>{e.preventDefault();try{const f=new FormData(e.target);if(!act().length)throw new Error("Add tenants first");const t=toP(f.get("a"));if(t<=0)throw new Error("Amount must be more than zero");const d=f.get("d");if(!d||d>TODAY)throw new Error("Choose a bill date that is not in the future");addBill(f.get("c"),f.get("x")||f.get("c")+" bill",t,d,f.get("m"));save();render();toast("Bill saved and shared between tenants")}catch(x){toast(x.message,1)}return false};
A.void=id=>{const r=prompt("Reason for voiding this bill? (it stays in the record)");if(!r||!r.trim())return;const b=D.bills.find(x=>x.id===id);b.st="void";b.why=r.trim();save();render();toast("Bill voided")};
const opts=a=>a.map(([v,l,s])=>`<option value="${v}" ${s?"selected":""}>${l}</option>`).join("");
function tenantView(){if(!act().length)return `<div class="card"><p class="mu">No tenants yet. Load sample data to explore, or switch to Manager view to add tenants and bills.</p><button class="b" onclick="A.seed()">Load sample data</button></div>`;
const t=ten(me),yrs=[...new Set(mine().map(b=>b.date.slice(0,4)))].sort().reverse(),w=win(range),B=mine().filter(b=>inW(b,w.f,w.t)),by={};
const ms=monthsOf(range),data={};B.forEach(b=>{const k=b.date.slice(0,7),c=grp(b.cat);(data[k]=data[k]||{})[c]=((data[k]||{})[c]||0)+b.sh[me]});
const tot=c=>sum(B.filter(b=>!c||grp(b.cat)===c).map(b=>b.sh[me])),T=tot(),prev=sum(mine().filter(b=>inW(b,w.pf,w.pt)).map(b=>b.sh[me]));
const mt=ms.map(m=>({l:m.l,v:sum(Object.values(data[m.k]||{}))})),hi=mt.reduce((a,b)=>b.v>a.v?b:a,{v:0,l:"-"});
const cmp=prev>0?`${T>=prev?"▲":"▼"} ${Math.abs(Math.round((T-prev)/prev*100))}% ${T>=prev?"higher":"lower"} than the previous period${range!=="last12"&&+range===now.getFullYear()?" (year to date vs full year)":""}`:"No earlier period to compare";
let L=B.filter(b=>(cat==="All"||grp(b.cat)===cat)&&(b.cat+" "+b.desc).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));const pages=Math.max(1,Math.ceil(L.length/8));pg=Math.min(pg,pages-1);
return `<div id="ph"><h2>Expense statement: ${esc(t.name)} (${esc(room(t.room).label)})</h2><p>Period: ${esc(w.label)}. Printed ${TODAY}.</p></div>
<div class="card noprint"><div class="row"><label>Period<select onchange="range=this.value;pg=0;render()"><option value="last12" ${range==="last12"?"selected":""}>Last 12 months</option>${yrs.map(y=>`<option ${range===y?"selected":""}>${y}</option>`).join("")}</select></label><button class="b o" onclick="A.csv()">Download CSV</button><button class="b o" onclick="print()">Print statement</button></div></div>
<div class="g"><div class="card"><span class="mu">Total (${esc(w.label)})</span><div class="big">${M(T)}</div><span class="mu">${cmp}</span></div>
<div class="card"><span class="mu"><i class="dot" style="background:var(--w)"></i>Water</span><div class="big">${M(tot("Water"))}</div></div>
<div class="card"><span class="mu"><i class="dot" style="background:var(--e)"></i>Electricity</span><div class="big">${M(tot("Electricity"))}</div></div>
<div class="card"><span class="mu"><i class="dot" style="background:var(--o)"></i>Other shared</span><div class="big">${M(tot("Other"))}</div></div>
<div class="card"><span class="mu">Monthly average</span><div class="big">${M(Math.round(T/w.months))}</div><span class="mu">Highest: ${hi.l} (${M(hi.v)})</span></div></div>
<div class="card"><h3>Month by month</h3>${B.length?chart(ms,data):'<p class="mu">No expenses in this period.</p>'}<p class="mu"><i class="dot" style="background:var(--w)"></i>Water <i class="dot" style="background:var(--e)"></i>Electricity <i class="dot" style="background:var(--o)"></i>Other (GH₵)</p>
<details><summary>Show as a table</summary><div class="tw"><table><tr><th>Month</th><th>Water</th><th>Electricity</th><th>Other</th><th>Total</th></tr>${ms.map(m=>{const d=data[m.k]||{};return `<tr><td>${m.l}</td><td>${M(d.Water||0)}</td><td>${M(d.Electricity||0)}</td><td>${M(d.Other||0)}</td><td><b>${M(sum(Object.values(d)))}</b></td></tr>`}).join("")}</table></div></details></div>
<div class="card"><h3>Your expenses</h3><div class="row noprint">${["All","Water","Electricity","Other"].map(c=>`<button class="chip" aria-pressed="${cat===c}" onclick="cat='${c}';pg=0;render()">${c}</button>`).join("")}<input id="qs" placeholder="Search expenses" value="${esc(q)}" aria-label="Search expenses" oninput="q=this.value;pg=0;render(1)"></div>
<div class="tw"><table><tr><th>Date</th><th>Expense</th><th>Whole bill</th><th>How it is split</th><th>Your share</th></tr>${L.slice(pg*8,pg*8+8).map(b=>`<tr><td>${b.date}</td><td><i class="dot" style="background:${COL[grp(b.cat)]}"></i>${esc(b.cat)}<br><small class="mu">${esc(b.desc)}</small></td><td>${M(b.total)}</td><td>${METH[b.m]}</td><td><b>${M(b.sh[me])}</b></td></tr>`).join("")||'<tr><td colspan="5" class="mu">No expenses match.</td></tr>'}</table></div>
<p class="noprint">Page ${pg+1} of ${pages} <button class="b s o" onclick="pg=Math.max(0,pg-1);render()">Previous</button> <button class="b s o" onclick="pg=Math.min(${pages-1},pg+1);render()">Next</button></p></div>`}
function managerView(){return `<div class="card"><h3>Add a tenant</h3><form class="f" onsubmit="return A.person(event)"><label>Name<input name="n" required></label><label>Room<input name="l" required></label><label>Monthly rent (GH₵)<input name="r" inputmode="decimal" required></label><button class="b">Add tenant</button></form></div>
<div class="card"><h3>Add a shared bill</h3>${act().length?`<form class="f" onsubmit="return A.bill(event)"><label>Category<select name="c">${opts(["Water","Electricity","Cleaning","Security","Waste collection","Repairs"].map(x=>[x,x]))}</select></label><label>Description<input name="x"></label><label>Total (GH₵)<input name="a" inputmode="decimal" required></label><label>Bill date<input name="d" type="date" value="${TODAY}" max="${TODAY}"></label><label>Split<select name="m">${opts([["equal","Equal split"],["room","By room rent"],["fixed","Fixed per tenant"]])}</select></label><button class="b">Save bill</button></form><p class="mu">Shares always add up exactly to the bill total. For "Fixed per tenant" the total is what each tenant pays.</p>`:'<p class="mu">Add a tenant first.</p>'}</div>
<div class="card tw"><h3>Bills</h3><table><tr><th>Date</th><th>Bill</th><th>Total</th><th>Split</th><th>Shares</th><th></th></tr>${[...D.bills].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(b=>`<tr style="${b.st==="void"?"opacity:.5":""}"><td>${b.date}</td><td>${esc(b.cat)}<br><small class="mu">${esc(b.desc)}${b.st==="void"?" · VOID: "+esc(b.why):""}</small></td><td>${M(b.total)}</td><td>${METH[b.m]}</td><td>${Object.entries(b.sh).map(([k,v])=>esc(ten(k)?.name)+": "+M(v)).join("<br>")}</td><td>${b.st==="void"?"":`<button class="b s o" onclick="A.void('${b.id}')">Void</button>`}</td></tr>`).join("")||'<tr><td colspan="6" class="mu">No bills yet.</td></tr>'}</table><p><button class="b s o" onclick="A.seed()">Load sample data</button> <button class="b s o" onclick="A.reset()">Clear all data</button></p></div>`}
function render(keep){const a=act();if(!ten(me)?.on&&a.length)me=a[0].id;$("#who").innerHTML=a.map(t=>`<option value="${t.id}" ${t.id===me?"selected":""}>${esc(t.name)} (${esc(room(t.room).label)})</option>`).join("")||"<option>No tenants</option>";$("#who").hidden=mode!=="tenant";
$("#mt").setAttribute("aria-pressed",mode==="tenant");$("#mm").setAttribute("aria-pressed",mode==="manager");$("#v").innerHTML=mode==="tenant"?tenantView():managerView();
if(keep){const i=$("#qs");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
$("#mt").onclick=()=>{mode="tenant";render()};$("#mm").onclick=()=>{mode="manager";render()};$("#who").onchange=e=>{me=e.target.value;pg=0;render()};
render();
</script></body></html>
